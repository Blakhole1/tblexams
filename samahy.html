      {q: "Q35. A patient with tabes dorsalis develops a distended, thin-walled, hypotonic urinary bladder with retention and overflow dribbling. This is due to:", choices: ["Increased micturition reflex activity.", "Loss of the visceral micturition reflex.", "Increased sympathetic stimulation of the bladder.", "Hyperactivity of the external urethral sphincter."], a: 1},
      {q: "Q36. A patient with tabes dorsalis develops small pupils that do not react to light but retain their accommodation response. What is the most likely associated finding?", choices: ["Horner syndrome", "Argyll-Robertson pupil", "Marcus Gunn pupil", "Fixed dilated pupil"], a: 1},
      {q: "Q37. A young patient presents with bilateral loss of pain and temperature sensation over the shoulders and upper limbs, while fine touch and proprioception remain intact. What is the most likely diagnosis?", choices: ["Tabes dorsalis", "Syringomyelia", "Brown-Séquard syndrome", "Thalamic syndrome"], a: 1},
      {q: "Q38. In a patient with syringomyelia, which structures are primarily affected to produce the characteristic sensory loss?", choices: ["Dorsal columns bilaterally.", "Crossing fibers of the spinothalamic tracts.", "Anterior horn cells bilaterally.", "Posterior roots bilaterally."], a: 1},
      {q: "Q39. A patient with syringomyelia has loss of pain, temperature, and rough touch in a jacket-shaped distribution. Which of the following sensations is expected to remain intact?", choices: ["Pain and temperature.", "Rough touch only.", "Fine touch and proprioception.", "All superficial sensations."], a: 2},
      {q: "Q40. A patient develops hemisection of the right half of the spinal cord. Which sensory disturbance is expected at the level of the lesion?", choices: ["Loss of all sensations on the right side.", "Loss of all sensations on the left side.", "Loss of pain and temperature on both sides.", "Loss of proprioception on the left side only."], a: 0},
      {q: "Q41. A patient with Brown-Séquard syndrome develops secondary hyperalgesia above the level of the lesion. This occurs on:", choices: ["The same side of the lesion.", "The opposite side of the lesion.", "Both sides equally.", "Neither side."], a: 0},
      {q: "Q42. A patient with right-sided spinal cord hemisection develops loss of fine touch and proprioception below the level of the lesion. This sensory loss occurs on:", choices: ["The right side.", "The left side.", "Both sides.", "Neither side."], a: 0},
      {q: "Q43. In Brown-Séquard syndrome, loss of pain, temperature, and rough touch below the level of the lesion occurs on:", choices: ["The same side of the lesion.", "The opposite side of the lesion.", "Both sides equally.", "The same side at the level only."], a: 1},
      {q: "Q44. A patient develops sudden contralateral hemianesthesia following occlusion of the thalamogeniculate artery. Which of the following is the most likely diagnosis?", choices: ["Syringomyelia", "Thalamic syndrome", "Tabes dorsalis", "Peripheral neuritis"], a: 1},
      {q: "Q45. A patient with thalamic syndrome develops severe, poorly localized pain in response to normally painful or temperature stimuli several weeks after the initial lesion. What is this manifestation called?", choices: ["Sensory ataxia", "Thalamic hyperpathia", "Secondary hyperalgesia", "Dissociated sensory loss"], a: 1},
      {q: "Q46. A patient with thalamic syndrome develops severe sensory ataxia. Which sensory modality is mainly responsible for this manifestation?", choices: ["Pain sensation.", "Temperature sensation.", "Proprioceptive sensation.", "Crude touch sensation."], a: 2},
      {q: "Q47. A patient develops contralateral hemianesthesia following rupture of the lenticulostriate artery. Which structure is most likely affected?", choices: ["Dorsal column.", "Internal capsule.", "Posterior horn.", "Anterior horn."], a: 1},
      {q: "Q48. A diabetic patient presents with numbness and decreased sensation in both hands and feet, producing a glove-and-stocking distribution. What is the most likely diagnosis?", choices: ["Thalamic syndrome", "Peripheral neuritis", "Syringomyelia", "Brown-Séquard syndrome"], a: 1},
      {q: "Q49. A patient with chronic alcohol use develops peripheral neuritis. Which of the following is an expected associated motor manifestation?", choices: ["Spastic paralysis of proximal muscles.", "Paresis or paralysis of distal parts.", "Contralateral hemiplegia.", "Quadriplegia with preserved sensation."], a: 1},
      {q: "Q50. A patient complains of frontal headache originating from intracranial structures located above the tentorium cerebelli. Which of the following is the expected site of referred pain?", choices: ["Occipital region.", "Frontal region.", "Cervical region.", "Temporal region only."], a: 1},
      {q: "Q51. A patient develops severe headache following spinal anesthesia due to removal of approximately 20 mL of CSF. What is the underlying mechanism?", choices: ["Increased intracranial pressure due to excess CSF.", "Reduced brain floating causing traction on cranial nerve roots.", "Cerebral vasoconstriction due to hypertension.", "Inflammation of the meninges."], a: 1},
      {q: "Q52. A patient presents with persistent, dull, aching, poorly localized headache that is not relieved by ordinary analgesics and is associated with vomiting and decreased heart rate. What is the most likely cause?", choices: ["Low CSF pressure.", "High CSF pressure.", "Hypertensive headache.", "Constipation headache."], a: 1},
      {q: "Q53. A hypertensive patient complains of a pulsatile, throbbing headache whose severity is related to pulse pressure. What is the underlying mechanism?", choices: ["Traction on cranial nerve roots.", "Stretching of cerebral blood vessels.", "Increased CSF production.", "Spasm of neck muscles."], a: 1},
      {q: "Q54. A patient develops headache following alcohol consumption or exposure to excessive heat. Which of the following mechanisms is most likely responsible?", choices: ["Cerebral vasoconstriction.", "Cerebral vasodilatation.", "Increased CSF absorption.", "Spasm of the cerebral arteries."], a: 1},
      {q: "Q55. A patient presents with severe headache, high fever, and neck muscle spasm. What is the most likely diagnosis?", choices: ["Migraine.", "Meningitis.", "Hypertensive headache.", "Low CSF pressure headache."], a: 1},
      {q: "Q56. A young female patient develops visual hallucinations approximately 30 minutes before the onset of a severe unilateral headache. What is the most likely explanation for this preceding phase?", choices: ["Marked cerebral vasodilatation.", "Reflex cerebral vasoconstriction causing ischemia.", "Increased intracranial pressure.", "Meningeal inflammation."], a: 1},
      {q: "Q57. A patient with migraine experiences a preceding aura followed by a severe headache that may persist for up to 48 hours. The headache phase is mainly associated with:", choices: ["Persistent cerebral vasoconstriction.", "Loss of vascular tone with marked vasodilatation.", "Decreased cerebral blood flow due to hypotension.", "Increased CSF absorption."], a: 1},
      {q: "Q58. A female patient experiences recurrent unilateral headaches associated with nausea, sweating, visual field disturbances, and facial twitching. Which of the following is the most likely diagnosis?", choices: ["Meningitis.", "Migraine.", "Hypertensive headache.", "Thalamic syndrome."], a: 1},
      {q: "Q59. A patient presents with recurrent headache associated with blurred vision. Ophthalmological examination reveals increased intraocular pressure. Which of the following is the most likely cause?", choices: ["Nasal sinusitis.", "Glaucoma.", "Middle ear disease.", "Errors of refraction."], a: 1},
      {q: "Q60. A patient presents with recurrent headache after developing nasal congestion and facial pain. Which of the following is the most likely extra-cranial cause?", choices: ["Intracranial venous sinus thrombosis.", "Nasal sinusitis.", "High CSF pressure.", "Thalamic vascular occlusion."], a: 1}
    ]}
];

let activeQuestions = [];
let index = 0, answers = {};
const $ = id => document.getElementById(id);

function getSelectedIds() {
  const boxes = document.querySelectorAll('#topics-list input[type="checkbox"]');
  const ids = [];
  boxes.forEach(cb => { if (cb.checked) ids.push(cb.value); });
  return ids;
}

function startSelectedQuiz(allowAllFallback) {
  let selectedIds = getSelectedIds();
  if (selectedIds.length === 0) {
    if (allowAllFallback) {
      document.querySelectorAll('#topics-list input[type="checkbox"]').forEach(cb => cb.checked = true);
      selectedIds = getSelectedIds();
    } else {
      alert('الرجاء اختيار موضوع واحد على الأقل لبدء الاختبار!');
      return;
    }
  }

  activeQuestions = [];
  selectedIds.forEach(id => {
    const topic = allChapters.find(t => t.id === id);
    if (topic && Array.isArray(topic.questions)) {
      activeQuestions.push(...topic.questions);
    }
  });

  if (activeQuestions.length === 0) {
    allChapters.forEach(t => activeQuestions.push(...t.questions));
  }

  index = 0;
  answers = {};

  $('setup-view').classList.add('hidden');
  $('result-view').classList.add('hidden');
  $('quiz-view').classList.remove('hidden');
  $('badge-count').textContent = `${activeQuestions.length} Questions Selected`;
  window.scrollTo(0, 0);
  renderQuiz();
}

function renderQuiz() {
  if (!activeQuestions.length) return;
  const item = activeQuestions[index], chosen = answers[index];
  $('qmeta').textContent = `QUESTION ${index + 1} / ${activeQuestions.length}`;
  $('question').textContent = item.q;
  const optContainer = $('options');
  optContainer.innerHTML = '';

  item.choices.forEach((choice, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = String.fromCharCode(65 + i);
    const label = document.createElement('span');
    label.textContent = choice;
    b.appendChild(letter);
    b.appendChild(label);

    if (chosen !== undefined) {
      b.disabled = true;
      if (i === item.a) b.classList.add('correct');
      if (i === chosen && chosen !== item.a) b.classList.add('wrong');
    }

    b.addEventListener('click', function() {
      if (answers[index] === undefined) {
        answers[index] = i;
        renderQuiz();
      }
    });
    optContainer.appendChild(b);
  });

  const fb = $('feedback');
  fb.className = 'feedback';
  if (chosen !== undefined) {
    fb.textContent = chosen === item.a
      ? 'Correct answer ✓'
      : `Incorrect. Correct answer: ${String.fromCharCode(65 + item.a)}. ${item.choices[item.a]}`;
    fb.className = chosen === item.a ? 'feedback good' : 'feedback bad';
  } else {
    fb.textContent = '';
  }

  $('prev').disabled = index === 0;
  $('next').textContent = index === activeQuestions.length - 1 ? 'View results →' : 'Next →';
  updateStats();
}

function updateStats() {
  const keys = Object.keys(answers);
  const n = keys.length;
  const c = keys.filter(k => answers[k] === activeQuestions[k].a).length;
  $('answered').textContent = n;
  $('correct').textContent = c;
  $('percent').textContent = (n ? Math.round(c / n * 100) : 0) + '%';
  $('bar').style.width = (activeQuestions.length ? (n / activeQuestions.length * 100) : 0) + '%';
}

function finishQuiz() {
  const keys = Object.keys(answers);
  const n = keys.length;
  const c = keys.filter(k => answers[k] === activeQuestions[k].a).length;
  $('quiz-view').classList.add('hidden');
  $('result-view').classList.remove('hidden');
  $('summary').textContent = `You answered ${n} of ${activeQuestions.length} questions. Score: ${c} / ${activeQuestions.length} (${Math.round(c / activeQuestions.length * 100)}%).`;

  $('review').innerHTML = '<h3>Review</h3>' + activeQuestions.map((q, i) => {
    const a = answers[i];
    return `<div class="review-item"><small>Question ${i + 1} · ${a === undefined ? 'Not answered' : a === q.a ? 'Correct' : 'Incorrect'}</small><strong>${escapeHtml(q.q)}</strong><div>${a === undefined ? 'No answer selected' : `Your answer: ${escapeHtml(q.choices[a])}`}</div><div style="color:var(--green)">Correct: ${escapeHtml(q.choices[q.a])}</div></div>`;
  }).join('');
  window.scrollTo(0, 0);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('select-all').addEventListener('click', function() {
  document.querySelectorAll('#topics-list input[type="checkbox"]').forEach(cb => cb.checked = true);
});

$('clear-all').addEventListener('click', function() {
  document.querySelectorAll('#topics-list input[type="checkbox"]').forEach(cb => cb.checked = false);
});

$('start-btn').addEventListener('click', function() {
  startSelectedQuiz(true);
});

$('back-setup').addEventListener('click', function() {
  $('quiz-view').classList.add('hidden');
  $('setup-view').classList.remove('hidden');
});

$('prev').addEventListener('click', function() {
  if (index > 0) { index--; renderQuiz(); }
});

$('next').addEventListener('click', function() {
  if (index < activeQuestions.length - 1) { index++; renderQuiz(); } else { finishQuiz(); }
});

$('finish').addEventListener('click', finishQuiz);

$('again').addEventListener('click', function() {
  $('result-view').classList.add('hidden');
  $('setup-view').classList.remove('hidden');
});
})();
</script>
